# Keeps external/EXDSchema on the newest commit of xivdev/EXDSchema's "latest" branch,
# so the generated sheet types follow new game patches without manual work.
# It moves to the newest commit that still builds (.github/scripts/update-schema.sh
# walks back from the tip), so one broken upstream commit only holds back the commits
# from it onward. If none of the new commits builds (e.g. the schema needs a newer
# Lumina.Excel generator), the run fails and nothing is committed — bump Lumina.Excel
# by hand, then re-run.
# Each bump is also a patch release: <Version> +0.0.1, tag vX.Y.Z, and release.yml
# attaches the Windows binary, so release users get the new schema too.
name: Update EXDSchema

on:
  schedule:
    - cron: '23 3 * * *' # daily
  workflow_dispatch:
    inputs:
      build:
        description: 'Build even if the schema is unchanged (pipeline check; never commits)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    # Windows: the project's MSBuild paths are Windows-style.
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Move EXDSchema to the newest buildable commit
        id: bump
        shell: bash
        run: bash .github/scripts/update-schema.sh

      - name: Build (pipeline check)
        if: steps.bump.outputs.changed != 'true' && inputs.build
        run: dotnet build SharpVision.csproj -c Release

      - name: Commit, bump patch version, tag and push
        id: commit
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          info=$(git -C external/EXDSchema log -1 --format='%cs, %h')
          skipped="${{ steps.bump.outputs.skipped }}"
          if [ "${skipped:-0}" -gt 0 ]; then info="$info; 빌드 안 되는 최신 ${skipped}개 보류"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Catch up with anything pushed since checkout before reading <Version>.
          git pull --rebase --autostash origin main
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SharpVision.csproj)
          IFS=. read -r major minor patch <<< "$version"
          next="$major.$minor.$((patch + 1))"
          sed -i "s:<Version>$version</Version>:<Version>$next</Version>:" SharpVision.csproj
          git add external/EXDSchema SharpVision.csproj
          git commit -m "chore(schema): EXDSchema latest 갱신 ($info) → v$next"
          git tag -a "v$next" -m "SharpVision v$next — EXDSchema latest 갱신 ($info)"
          git push origin HEAD:main
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  release:
    needs: update
    if: needs.update.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
    permissions:
      contents: write
