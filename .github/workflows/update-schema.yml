# Keeps external/EXDSchema on the newest commit of xivdev/EXDSchema's "latest" branch,
# so the generated sheet types follow new game patches without manual work.
# It moves to the newest commit that still builds (.github/scripts/update-schema.sh
# walks back from the tip), so one broken upstream commit only holds back the commits
# from it onward. Held-back commits don't fail the run (that would mail every day
# until upstream fixes them); instead one "schema-blocked" issue is opened (and kept
# up to date) while anything is held back, and closed automatically once the tip
# builds again. If it lingers, check upstream — the schema may need a newer
# Lumina.Excel generator, which is bumped by hand.
# Each bump is also a patch release: <Version> +0.0.1, tag vX.Y.Z, and release.yml
# attaches the Windows binary, so release users get the new schema too.
name: Update EXDSchema

on:
  schedule:
    - cron: '23 3 * * *' # daily
  workflow_dispatch:
    inputs:
      build:
        description: 'Build even if the schema is unchanged (pipeline check; never commits)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    # Windows: the project's MSBuild paths are Windows-style.
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Move EXDSchema to the newest buildable commit
        id: bump
        shell: bash
        run: bash .github/scripts/update-schema.sh

      - name: Build (pipeline check)
        if: steps.bump.outputs.changed != 'true' && inputs.build
        run: dotnet build SharpVision.csproj -c Release

      - name: Commit, bump patch version, tag and push
        id: commit
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          info=$(git -C external/EXDSchema log -1 --format='%cs, %h')
          skipped="${{ steps.bump.outputs.skipped }}"
          if [ "${skipped:-0}" -gt 0 ]; then info="$info; 빌드 안 되는 최신 ${skipped}개 보류"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Catch up with anything pushed since checkout before reading <Version>.
          git pull --rebase --autostash origin main
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SharpVision.csproj)
          IFS=. read -r major minor patch <<< "$version"
          next="$major.$minor.$((patch + 1))"
          sed -i "s:<Version>$version</Version>:<Version>$next</Version>:" SharpVision.csproj
          git add external/EXDSchema SharpVision.csproj
          git commit -m "chore(schema): EXDSchema latest 갱신 ($info) → v$next"
          git tag -a "v$next" -m "SharpVision v$next — EXDSchema latest 갱신 ($info)"
          git push origin HEAD:main
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      # One tracking issue while any newer upstream commit is held back: created once
      # (one notification), body refreshed on later runs (no notification), closed
      # automatically when an update reaches the tip again.
      - name: Track held-back schema commits in an issue
        if: always() && steps.bump.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.bump.outputs.blocked }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          label=schema-blocked
          num=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$BLOCKED" = true ]; then
            report="$RUNNER_TEMP/schema-blocked.md"
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file "$report"
              echo "Updated issue #$num"
            else
              gh label create "$label" --color D93F0B --description "EXDSchema auto-update is holding back commits" 2>/dev/null || true
              gh issue create --title "EXDSchema 자동 갱신 보류 중" --label "$label" --body-file "$report"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "EXDSchema 최신 커밋까지 정상 반영되어 자동으로 닫습니다.${TAG:+ ($TAG)}"
          fi

  release:
    needs: update
    if: needs.update.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
    permissions:
      contents: write
